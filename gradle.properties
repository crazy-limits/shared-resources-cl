# Gradle options only, mod and dependency properties live in stonecutter.properties.toml
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Loom's decompile/remap steps still trip the configuration cache on some versions
org.gradle.configuration-cache=false

# Loom version used by loom-back-compat for every Fabric target
loomx.loom_version=1.18.2

# ForgeGradle 7: resources and classes in one output directory, required for Forge dev runs
net.minecraftforge.gradle.merge-source-sets=true
